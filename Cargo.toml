[workspace]
resolver = "3"
members = [
    "crates/cvbbmso-accoding",
    "crates/cvbbmso-client",
    "crates/cvbbmso-protocol",
    "crates/cvbbmso-recorder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
axum = { version = "0.8", default-features = false }
block2 = { version = "0.6", default-features = false, features = ["std"] }
cvbbmso-accoding = { version = "0.1.0", path = "crates/cvbbmso-accoding" }
cvbbmso-protocol = { version = "0.1.0", path = "crates/cvbbmso-protocol" }
dispatch2 = { version = "0.3", default-features = false, features = ["objc2", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http = "1.0"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFCGTypes", "CFDictionary", "CFNumber", "CFString", "objc2", "std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGDirectDisplay", "objc2", "std"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2", "objc2-core-video", "std"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "objc2", "std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSDate", "NSHTTPCookie", "NSError", "NSString"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "std"] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = ["VTCompressionProperties", "VTCompressionSession", "VTErrors", "VTSession", "objc2", "objc2-core-media", "objc2-core-video", "std"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore", "block2"] }
insta = { version = "1.43", features = ["json"] }
proptest = "1.7"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
tauri = { version = "2.11.6", default-features = false, features = ["wry", "custom-protocol"] }
tauri-build = { version = "2.6.3" }
tempfile = "3.0"
thiserror = "2.0"
time = { version = "0.3", default-features = false, features = [
    "formatting",
    "parsing",
    "serde",
    "serde-well-known",
] }
tokio = { version = "1.0", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
url = "2.5"
uuid = { version = "1.11", default-features = false, features = ["serde"] }
webview2-com = "0.38"
windows = { version = "0.61", default-features = false }
windows-core = "0.61"
windows-sys = "0.61"
wiremock = "0.6"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
