[package]
name = "cvbbmso-network"
description = "Client network preflight and system egress guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "cvbbmso_network"
path = "src/lib.rs"

[[bin]]
name = "cvbbmso-egress-watchdog"
path = "src/bin/cvbbmso-egress-watchdog.rs"

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
libc.workspace = true
system-configuration.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url.workspace = true
wiremock.workspace = true

[lints]
workspace = true
