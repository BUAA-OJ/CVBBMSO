[package]
name = "cvbbmso-exam"
description = "Client exam runtime: monitor connection, commands, recording, and the local event queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cvbbmso-accoding.workspace = true
cvbbmso-protocol.workspace = true
cvbbmso-recorder.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util = { workspace = true, features = ["sink"] }
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-native-roots"] }
tracing = { workspace = true, features = ["std"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
wiremock.workspace = true

[lints]
workspace = true
