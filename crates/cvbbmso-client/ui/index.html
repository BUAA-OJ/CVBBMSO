<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CVBBMSO</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <h1>CVBBMSO</h1>
      <h2>Accoding 登录</h2>
      <p>在 Accoding 窗口登录后，可回到这里检查会话。</p>
      <div class="actions">
        <button id="open" type="button">打开 Accoding</button>
        <button id="inspect" type="button" disabled>检查会话</button>
      </div>
      <p id="session" role="status"></p>
      <section class="exam-panel" aria-labelledby="exam-heading">
        <div class="exam-heading">
          <h2 id="exam-heading">报名考试</h2>
          <button id="refresh-exams" type="button" disabled>加载列表</button>
        </div>
        <p id="exam-status" role="status">登录 Accoding 后加载报名列表。</p>
        <ul id="exams" class="exam-list"></ul>
      </section>
    </main>
  </body>
</html>
