[package]
name = "cvbbmso-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cvbbmso-client"
path = "src/main.rs"
harness = false

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cvbbmso-accoding.workspace = true
serde.workspace = true
tauri.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2-foundation.workspace = true
objc2-web-kit.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com.workspace = true
windows-core.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["http1", "json", "tokio", "ws"] }
cvbbmso-accoding.workspace = true
cvbbmso-protocol.workspace = true
futures-util.workspace = true
rcgen.workspace = true
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
serde_json.workspace = true
time.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
url.workspace = true
uuid.workspace = true
