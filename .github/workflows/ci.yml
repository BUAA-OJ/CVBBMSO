name: CI

on:
  pull_request:
    branches: [main, feat/client]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  check:
    name: Check Rust 1.88 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check the minimum Rust version
        run: |
          rustc +1.88.0 -Vv
          cargo +1.88.0 check --workspace --all-targets --locked

  desktop-smoke:
    name: Desktop Release smoke (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record Windows version
        if: runner.os == 'Windows'
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber
          try {
            Get-CimInstance Win32_ComputerSystem -Property Manufacturer,Model,HypervisorPresent -OperationTimeoutSec 3 -ErrorAction Stop |
              Select-Object Manufacturer,Model,HypervisorPresent | Format-List
            Get-CimInstance Win32_BaseBoard -Property Manufacturer,Product -OperationTimeoutSec 3 -ErrorAction Stop |
              Select-Object Manufacturer,Product | Format-List
          } catch {
            Write-Output 'Computer-system or baseboard properties unavailable on this runner.'
          }
      - name: Record macOS and WebKit versions
        if: runner.os == 'macOS'
        run: |
          sw_vers
          sysctl hw.model kern.hv_vmm_present || true
          defaults read /System/Library/Frameworks/WebKit.framework/Resources/Info CFBundleVersion
      - name: Record the native probe result on the hosted runner
        run: cargo test --release --locked -p cvbbmso-client --bin cvbbmso-client -- --native-vm-probe
      - run: cargo test --release --locked -p cvbbmso-client --bin cvbbmso-client -- --native-smoke
      - run: cargo test --release --locked -p cvbbmso-client --bin cvbbmso-client -- --native-smoke-detected
      - name: Build Windows x64 Release for VM acceptance
        if: runner.os == 'Windows'
        run: |
          if ((rustc -vV) -notcontains 'host: x86_64-pc-windows-msvc') {
            throw 'The Windows acceptance build must use the x64 MSVC host toolchain.'
          }
          cargo build --release --locked -p cvbbmso-client
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: cvbbmso-client-windows-x64-acceptance
          path: target/release/cvbbmso-client.exe
          if-no-files-found: error
          retention-days: 7

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
