name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/hosted-egress-capabilities') }}
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/hosted-egress-capabilities') }}
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/hosted-egress-capabilities') }}
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  check:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/hosted-egress-capabilities') }}
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/hosted-egress-capabilities') }}
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  audit:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/hosted-egress-capabilities') }}
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  hosted-egress-capabilities:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/hosted-egress-capabilities' }}
    name: Egress capabilities (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check capabilities and supervised failure paths
        timeout-minutes: 3
        run: python -I -B .github/hosted_egress_probe.py
      - name: Retain capability and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egress-capabilities-${{ matrix.os }}
          path: ${{ runner.temp }}/cvbbmso-hosted-egress.json
          if-no-files-found: error
          retention-days: 7
